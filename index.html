<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Location Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📍 Real-Time Location Tracker</h1>
            <p>Track your location in real-time</p>
        </header>

        <div class="main-content">
            <!-- Map Container -->
            <div id="map" class="map-container"></div>

            <!-- Location Info Panel -->
            <div class="info-panel">
                <div class="panel-section">
                    <h2>Current Location</h2>
                    <div class="location-info">
                        <div class="info-item">
                            <label>Latitude:</label>
                            <span id="latitude">--</span>
                        </div>
                        <div class="info-item">
                            <label>Longitude:</label>
                            <span id="longitude">--</span>
                        </div>
                        <div class="info-item">
                            <label>Accuracy:</label>
                            <span id="accuracy">--</span>
                        </div>
                        <div class="info-item">
                            <label>Altitude:</label>
                            <span id="altitude">--</span>
                        </div>
                        <div class="info-item">
                            <label>Speed:</label>
                            <span id="speed">--</span>
                        </div>
                        <div class="info-item">
                            <label>Last Updated:</label>
                            <span id="timestamp">--</span>
                        </div>
                    </div>
                </div>

                <!-- Controls -->
                <div class="panel-section controls">
                    <button id="startBtn" class="btn btn-primary" onclick="startTracking()">Start Tracking</button>
                    <button id="stopBtn" class="btn btn-danger" onclick="stopTracking()" disabled>Stop Tracking</button>
                    <button id="clearBtn" class="btn btn-secondary" onclick="clearMap()">Clear Trail</button>
                </div>

                <!-- Status -->
                <div class="panel-section status">
                    <h3>Status</h3>
                    <p id="status" class="status-text">Ready to start tracking</p>
                </div>

                <!-- Distance Traveled -->
                <div class="panel-section">
                    <h3>Distance Traveled</h3>
                    <p id="distance" class="distance-text">0.00 km</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
